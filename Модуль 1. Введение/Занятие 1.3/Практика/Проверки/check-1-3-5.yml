name: 1.3.5 Модуль светодиода

on:
  push:
    paths:
      - '134-led-module/**'
      - '.github/workflows/check-1-3-5.yml'
  workflow_dispatch:

# Пока идёт отладка, пушей подряд бывает много: в работе остаётся последний,
# предыдущие прогоны той же проверки отменяются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ant-lab-ru/es-test/.github/workflows/check-1-3-5.yml@master
    secrets:
      ES_ACCOUNT_SECRET: ${{ secrets.ES_ACCOUNT_SECRET }}
