name: 2.3.6 Библиотеки

on:
  push:
    paths:
      - '231-firmware-template/**'
      - 'libs/**'
      - '.github/workflows/check-2-3-6.yml'
  workflow_dispatch:

# Пока идёт отладка, пушей подряд бывает много: в работе остаётся последний,
# предыдущие прогоны той же проверки отменяются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ant-lab-ru/es-test/.github/workflows/check-2-3-6.yml@master
    secrets:
      ES_ACCOUNT_SECRET: ${{ secrets.ES_ACCOUNT_SECRET }}
