name: 1.2.2 Светодиод и кнопка

on:
  push:
    paths:
      - '122-led-button/**'
      - '.github/workflows/check-1-2-2.yml'
  workflow_dispatch:

# Пока идёт отладка, пушей подряд бывает много: в работе остаётся последний,
# предыдущие прогоны той же проверки отменяются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ant-lab-ru/es-test/.github/workflows/check-1-2-2.yml@master
    secrets:
      ES_ACCOUNT_SECRET: ${{ secrets.ES_ACCOUNT_SECRET }}
