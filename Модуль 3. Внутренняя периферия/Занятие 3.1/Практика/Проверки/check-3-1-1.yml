name: 3.1.1 Измерение напряжения

on:
  push:
    paths:
      - '311-adc/**'
      - 'libs/**'
      - '.github/workflows/check-3-1-1.yml'
  workflow_dispatch:

# Пока идёт отладка, пушей подряд бывает много: в работе остаётся последний,
# предыдущие прогоны той же проверки отменяются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ant-lab-ru/es-test/.github/workflows/check-3-1-1.yml@master
    secrets:
      ES_ACCOUNT_SECRET: ${{ secrets.ES_ACCOUNT_SECRET }}
